# Installs the latest released APK on an Android emulator, opens it,
# (API 30 x86_64 images can run ARM apps)
# and saves any crash log so problems can be fixed without a cable to the TV.
name: Test on emulator

on:
  workflow_dispatch:   # old Remote Play version; run by hand only

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download latest APK
        run: curl -fsSL -o app.apk "https://github.com/${{ github.repository }}/releases/latest/download/ps-arabic-translator.apk"

      - name: Write test script
        run: |
          cat > run-test.sh <<'SH'
          set -x
          adb install -r app.apk || true
          adb logcat -c
          adb shell am start -W -n com.psarabic.translator/com.metallic.chiaki.main.MainActivity || true
          sleep 20
          echo "=== PROCESS ==="; adb shell pidof com.psarabic.translator || echo "NOT RUNNING (crashed?)"
          adb logcat -d -b crash > crash.txt || true
          adb logcat -d -v brief > full.txt || true
          echo "=== CRASH BUFFER ==="; cat crash.txt
          echo "=== APP LINES ==="; grep -E "AndroidRuntime|FATAL|libc|DEBUG|psarabic|chiaki|Chiaki" full.txt | tail -200
          adb exec-out screencap -p > screen.png || true
          SH
          chmod +x run-test.sh

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./run-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: |
            crash.txt
            full.txt
            screen.png

# Builds both parts of Tarjemni (ترجمني) and publishes them as one release:
#   tarjemni-tv.apk        -> Android TV (updates itself from here)
#   Tarjemni-Windows.zip   -> laptop (updates itself from here)
#   version.json           -> what the apps compare against to auto-update
name: Build Tarjem

on:
  push:
    branches: [main]
    paths: ["tarjem/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}00

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Signing key (same key every build, so updates install over the old app)
        run: mkdir -p ~/.android && cp signing.keystore ~/.android/debug.keystore
      - name: Build and unit test
        run: gradle -p tarjem/tv-app --no-daemon testDebugUnitTest assembleDebug
      - run: cp tarjem/tv-app/app/build/outputs/apk/debug/app-debug.apk tarjemni-tv.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write emulator test
        run: |
          cat > tv-test.sh <<'SH'
          set -x
          adb shell wm size 1920x1080
          adb shell wm density 320
          adb install -r tarjemni-tv.apk
          adb shell appops set com.tarjem.tv SYSTEM_ALERT_WINDOW allow
          adb logcat -c
          adb shell am start -W -n com.tarjem.tv/.MainActivity
          sleep 6
          adb exec-out screencap -p > tv-app.png
          adb forward tcp:47800 tcp:47800
          adb shell input keyevent KEYCODE_HOME
          sleep 2
          python3 - <<'PY'
          import json, socket, time
          s = socket.create_connection(("127.0.0.1", 47800), timeout=10)
          f = s.makefile("rw", encoding="utf-8")
          def send(m): f.write(json.dumps(m, ensure_ascii=False) + "\n"); f.flush()
          send({"t": "hello", "name": "ci"}); print("welcome:", f.readline().strip())
          send({"t": "style", "style": {"font": "cairo", "speaker": "#F5B841", "outline": True, "outlineWidth": 3}}); print("style:", f.readline().strip())
          send({"t": "show", "ttl": 30000, "items": [
            {"rect": [0.33, 0.70, 0.34, 0.04], "lh": 0.04, "lines": [{"s": "جيسون", "t": "توقفي يا لوسيا!"}]},
            {"rect": [0.28, 0.76, 0.44, 0.04], "lh": 0.04, "lines": [{"s": "لوسيا", "t": "ما راح أوقف، لازم نخلص الشغلة الحين قبل لا توصل الشرطة."}]}]})
          time.sleep(3)
          PY
          adb exec-out screencap -p > tv-screen.png
          echo "=== OVERLAY WINDOW ==="; adb shell dumpsys window windows | grep -i -A3 "TarjemCaptions" | head -8 || true
          echo "=== CRASHES ==="; adb logcat -d -b crash
          adb shell dumpsys window windows | grep -q TarjemCaptions && echo "OVERLAY_OK" || (echo "OVERLAY_MISSING"; exit 1)
          SH
          chmod +x tv-test.sh
      - name: Test on an Android emulator (TV-sized screen)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./tv-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv
          path: |
            tarjemni-tv.apk
            tv-screen.png
            tv-app.png

  pc:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tarjem/pc-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests (including real Windows OCR)
        run: python -m pytest -q tests
      - name: Stamp version
        shell: pwsh
        run: Set-Content -Path tarjem/version.py -Value "VERSION = $env:VERSION_CODE"
      - name: Build Tarjemni.exe
        run: pyinstaller --noconfirm --onefile --name Tarjemni --add-data "tarjem/ui.html;tarjem" --add-data "tarjem/fonts;tarjem/fonts" --collect-all winrt run_tarjem.py
      - name: Add adb (for granting the TV permission from the laptop)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          New-Item -ItemType Directory -Force dist/adb | Out-Null
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll dist/adb/
          Copy-Item pt/platform-tools/NOTICE.txt dist/adb/ -ErrorAction SilentlyContinue
      - name: Smoke test the packaged exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Tarjemni.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 12
          $state = Invoke-RestMethod http://127.0.0.1:47880/api/state
          Write-Host "state: running=$($state.running) version=$($state.version)"
          if ("$($state.version)" -ne "$env:VERSION_CODE") { throw "version not stamped" }
          $ui = (Invoke-WebRequest http://127.0.0.1:47880/ -UseBasicParsing).Content
          if ($ui -notmatch "api/state") { throw "UI not served" }
          $font = Invoke-WebRequest http://127.0.0.1:47880/fonts/cairo.ttf -UseBasicParsing
          if ($font.RawContentLength -lt 100000) { throw "fonts missing" }
          $self = Invoke-RestMethod http://127.0.0.1:47880/api/selftest
          Write-Host "selftest: $($self | ConvertTo-Json -Compress)"
          Stop-Process -Id $p.Id -Force
          if (-not $self.ocr_ok) { throw "OCR self-test failed inside the exe" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Tarjemni.exe, dist/adb -DestinationPath ../../Tarjemni-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: Tarjemni-Windows.zip

  release:
    needs: [tv, pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Version file for the auto-updaters
        run: |
          echo "{\"tv\": $VERSION_CODE, \"pc\": $VERSION_CODE}" > version.json
          cp tv/tarjemni-tv.apk tarjem-tv.apk   # old link keeps working
          cat version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tarjemni-${{ github.run_number }}
          name: ترجمني ${{ github.run_number }}
          body: |
            التلفزيون (Downloader): https://github.com/${{ github.repository }}/releases/latest/download/tarjemni-tv.apk
            اللابتوب: https://github.com/${{ github.repository }}/releases/latest/download/Tarjemni-Windows.zip
            البرنامجين يحدّثون نفسهم تلقائياً من هالإصدار وطالع.
          files: |
            tv/tarjemni-tv.apk
            tarjem-tv.apk
            pc/Tarjemni-Windows.zip
            version.json
            tv/tv-screen.png
            tv/tv-app.png
          make_latest: true

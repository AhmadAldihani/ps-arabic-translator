plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.tarjem.tv"
    compileSdk 34

    defaultConfig {
        applicationId "com.tarjem.tv"
        minSdk 26
        // 33: no foreground-service type needed; this app is side-loaded, not on Play.
        targetSdk 33
        // The build sets VERSION_CODE (GitHub run number + 100) so every build can update the last one.
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName "2." + (System.getenv("VERSION_CODE") ?: "0")
    }

    // One fixed key for every build (repo root signing.keystore), so each update installs over the last one.
    signingConfigs {
        stable {
            storeFile rootProject.file("../../signing.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    sourceSets {
        test.java.srcDirs += "src/test/java"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
